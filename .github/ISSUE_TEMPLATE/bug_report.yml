---
name: Bug Report
description: Relatar um bug ou comportamento inesperado
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Preencha abaixo para ajudar a reproduzir e corrigir.
  - type: input
    id: os
    attributes:
      label: Sistema Operacional (PC)
      description: Windows 10/11, macOS 14+, Ubuntu 22.04, Arch, Fedora, etc.
      placeholder: "ex: Ubuntu 24.04 / Windows 11"
    validations:
      required: true
  - type: input
    id: python_version
    attributes:
      label: Versão do Python
      description: Rode `python --version`
      placeholder: "ex: 3.12.3"
    validations:
      required: true
  - type: input
    id: phone_os
    attributes:
      label: Celular + Navegador
      description: Modelo do celular e navegador usado
      placeholder: "ex: iPhone 15 Safari / Pixel 8 Chrome"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Passos para Reproduzir
      description: Passos numerados para reproduzir o bug
      placeholder: |
        1. Rode `./run.sh --audio`
        2. Conecte o celular via QR Code
        3. Toque em "🎤 Microfone ON"
        4. Erro aparece no terminal: ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento Esperado
      description: O que deveria acontecer
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento Atual
      description: O que acontece de fato (inclua logs/erros)
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output do Terminal
      description: Cole o output relevante (remova IPs/PINs sensíveis)
      render: shell
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: Já testei com `--no-audio` (isolando vídeo vs áudio)
          required: false
        - label: Já testei em outra rede Wi-Fi / cabo
          required: false
        - label: Verifiquei se o módulo v4l2loopback está carregado (Linux)
          required: false
        - label: Li a seção "Solução de problemas" do README
          required: false