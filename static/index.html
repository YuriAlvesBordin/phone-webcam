<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>PhoneCam</title>
<link rel="stylesheet" href="/css/styles.css">
<script type="module" src="/js/app.js"></script>
</head>
<body>

<!-- PIN screen -->
<div class="pin-overlay" id="pinOverlay">
  <div class="pin-card">
    <div class="pin-logo" aria-hidden="true">📱</div>
    <h2>PhoneCam</h2>
    <p class="sub">Digite o PIN de 6 dígitos exibido no terminal do PC para conectar a câmera.</p>
    <div class="pin-input-wrap">
      <input
        type="tel"
        id="pinInput"
        class="pin-input"
        inputmode="numeric"
        maxlength="6"
        placeholder="••••••"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        aria-label="PIN de 6 dígitos"
      >
    </div>
    <button class="btn-primary" id="connectBtn">Conectar</button>
    <p class="pin-error" id="pinError" role="alert"></p>
  </div>
</div>

<!-- Main screen -->
<header class="topbar hidden" id="topbar">
  <div class="brand"><span class="dot" id="liveDot" aria-hidden="true"></span>PhoneCam</div>
  <div class="meta">
    <span id="fps" aria-live="off">- fps</span>
    <span id="rtt" aria-live="off"></span>
  </div>
</header>

<div class="wake-hint hidden" id="wakeHint" role="button" tabindex="0">
  💡 Tela livre para apagar - toque para reativar
</div>

<main class="stage hidden" id="stage">
  <video id="video" autoplay playsinline muted></video>
  <div class="placeholder" id="placeholder">
    <div class="icon" aria-hidden="true">📷</div>
    <div>Aguardando câmera…</div>
  </div>
  <div class="reconnect-bar hidden" id="reconnectBar" role="status">Reconectando…</div>
  <div class="stats-panel hidden" id="statsPanel" aria-hidden="true"></div>
  <div class="orient-hint" id="orientHint">📱 Gire para a horizontal - qualidade melhora</div>
  <div class="zoom-indicator hidden" id="zoomIndicator">1.0×</div>
</main>

<div class="controls hidden" id="controls">
  <button class="btn" id="flipBtn" disabled aria-label="Trocar câmera">🔄 Trocar câmera</button>
  <button class="btn danger" id="toggleBtn" disabled aria-label="Pausar transmissão">⏸ Pausar</button>
  <button class="btn hidden" id="torchBtn" aria-label="Ligar lanterna">🔦 Lanterna</button>

  <div class="zoom-panel">
    <button class="zoom-btn" id="zoomOutBtn" disabled aria-label="Diminuir zoom">−</button>
    <input type="range" class="zoom-slider" id="zoomSlider"
           min="1" max="4" step="0.1" value="1" disabled aria-label="Zoom">
    <button class="zoom-btn" id="zoomInBtn" disabled aria-label="Aumentar zoom">+</button>
    <div class="zoom-label" id="zoomLabel">1.0×</div>
  </div>

  <div class="zoom-quick">
    <button class="zoom-quick-btn" data-zoom="1" disabled>1×</button>
    <button class="zoom-quick-btn" data-zoom="2" disabled>2×</button>
    <button class="zoom-quick-btn" data-zoom="3" disabled>3×</button>
    <button class="zoom-quick-btn" data-zoom="4" disabled>4×</button>
  </div>

  <div class="audio-panel" id="audioPanel">
    <button class="btn audio-btn" id="micToggleBtn" disabled aria-label="Ativar microfone">🎤 Microfone OFF</button>
    <span class="audio-status" id="audioStatus">Áudio desativado</span>
  </div>
</div>

<div class="status-bar hidden" id="statusBar" role="status">Conectando…</div>

</body>
</html>
